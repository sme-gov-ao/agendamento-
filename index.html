function renderServ(){let html=`<div class="card"><h2>🗺️ 21 Províncias - Cobertura Nacional Completa</h2><p style="font-size:12px;opacity:.7">Clique em cada província para ver municípios, bairros/zonas e postos SME sincronizados. Luanda com mais postos.</p><div class="grid3" style="margin-top:14px">${Object.keys(PROVS).map(p=>`<div class="prov" onclick="selProv('${p}')" id="prov-${p}"><b>${p}</b><small>${PROVS[p].mun.length} municípios</small><small>${PROVS[p].bairros.length} bairros</small><small>${PROVS[p].postos.length} postos</small></div>`).join("")}</div><div id="prov-det" style="margin-top:16px"></div></div>`; document.getElementById("p-servicos").innerHTML=html;}
function selProv(p){document.querySelectorAll(".prov").forEach(e=>e.classList.remove("active")); document.getElementById("prov-"+p)?.classList.add("active"); let d=PROVS[p]; document.getElementById("prov-det").innerHTML=`<div class="card" style="border-color:var(--azul)"><h3>${p} - Detalhes Completos</h3><p style="font-size:12px;margin-top:6px;line-height:1.7"><b>Municípios (${d.mun.length}):</b> ${d.mun.join(", ")}<br><b>Bairros/Zonas (${d.bairros.length}):</b> ${d.bairros.join(", ")}<br><b>Postos SME (${d.postos.length}):</b> ${d.postos.join(" • ")}</p><button class="btn btn-p" style="margin-top:10px" onclick="form.prov='${p}';form.mun='${d.mun[0]}';form.posto='${d.postos[0]}';go('agendar')">Agendar em ${p} →</button></div>`; form.prov=p; form.mun=d.mun[0]; form.posto=d.postos[0];}
function renderAgendar(){let provOpts=Object.keys(PROVS).map(p=>`<option ${form.prov===p?'selected':''}>${p}</option>`).join(""); let munOpts=(PROVS[form.prov]?.mun||[]).map(m=>`<option ${form.mun===m?'selected':''}>${m}</option>`).join(""); let postoOpts=(PROVS[form.prov]?.postos||[]).map(po=>`<option ${form.posto===po?'selected':''}>${po}</option>`).join("");document.getElementById("p-agendar").innerHTML=`<div class="card"><h2>🛂 Agendamento de Passaporte Electrónico</h2><div class="steps"><div class="step"><i style="width:${step>=1?100:0}%"></i></div><div class="step"><i style="width:${step>=2?100:0}%"></i></div><div class="step"><i style="width:${step>=3?100:0}%"></i></div><div class="step"><i style="width:${step>=4?100:0}%"></i></div></div><div style="font-size:11px;font-weight:800;opacity:.6">ETAPA ${step} DE 4</div>${step===1?`<label class="label">Nome completo</label><input id="f-nome" class="input" autocomplete="off" value="${form.nome}"><div class="grid2"><div><label class="label">Email</label><input id="f-email" class="input" autocomplete="off" value="${form.email}"></div><div><label class="label">Telefone</label><input id="f-tel" class="input" autocomplete="off" value="${form.tel}"></div></div><div class="grid2"><div><label class="label">Naturalidade</label><input id="f-nat" class="input" autocomplete="off" value="${form.nat}"></div><div><label class="label">N° BI</label><input id="f-bi" class="input" autocomplete="off" value="${form.bi}"></div></div><button class="btn btn-p" style="margin-top:12px" onclick="nextStep(2)">Continuar →</button>`:step===2?`<label class="label">Província (21 províncias Lei 14/24)</label><select id="f-prov" class="input" onchange="form.prov=this.value;renderAgendar()">${provOpts}</select><div class="grid2"><div><label class="label">Município (auto-sync)</label><select id="f-mun" class="input" onchange="form.mun=this.value">${munOpts}</select></div><div><label class="label">Bairro / Zona</label><input id="f-bairro" class="input" list="bairros-list" autocomplete="off" value="${form.bairro}" placeholder="ex: Zango 3"><datalist id="bairros-list">${(PROVS[form.prov]?.bairros||[]).map(b=>`<option value="${b}">`).join("")}</datalist></div></div><label class="label">Posto SME (${PROVS[form.prov]?.postos.length} postos nesta província)</label><select id="f-posto" class="input" onchange="form.posto=this.value">${postoOpts}</select><div style="margin-top:12px;display:flex;gap:8px"><button class="btn" style="background:#e2e8f0" onclick="step=1;renderAgendar()">Voltar</button><button class="btn btn-p" onclick="nextStep(3)">Continuar →</button></div>`:step===3?`<div class="card" style="background:#fff1f2"><b>💳 Pagamento Da Taxa: </b><br><small> Faça Pagamento no ATM ou Multicaixa Express na opção pagamentos por referência > entidade  01148 > referência 945743670</small></div><label class="label">Anexar comprovativo (obrigatório para liberar recibo)</label><input type="file" id="f-comp" class="input" accept="image/*,.pdf" onchange="handleComp(this)"><div id="comp-prev" style="margin-top:8px;font-size:12px">${form.compNome?`✅ ${form.compNome}`:'Nenhum arquivo - botão desabilitado'}</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn" style="background:#e2e8f0" onclick="step=2;renderAgendar()">Voltar</button><button class="btn btn-p" id="btn-gerar" ${!form.compNome?'disabled':''} onclick="gerar()">Gerar Recibo PDF 🎉</button></div>`: `<div id="recibo-area"></div>`}</div>`;}
function nextStep(n){form.nome=document.getElementById("f-nome")?.value||form.nome; form.email=document.getElementById("f-email")?.value||form.email; form.tel=document.getElementById("f-tel")?.value||form.tel; form.nat=document.getElementById("f-nat")?.value||form.nat; form.bi=document.getElementById("f-bi")?.value||form.bi; if(n===3){form.mun=document.getElementById("f-mun")?.value||form.mun; form.bairro=document.getElementById("f-bairro")?.value||form.bairro; form.posto=document.getElementById("f-posto")?.value||form.posto;} step=n; renderAgendar();}
function handleComp(i){if(i.files&&i.files[0]){form.compNome=i.files[0].name; document.getElementById("comp-prev").innerHTML=`✅ ${form.compNome} - Preview OK`; document.getElementById("btn-gerar")?.removeAttribute("disabled");}}
function gerar(){if(!form.compNome) return alert("Anexe comprovativo"); let codigo="SME-AG-21-"+new Date().getFullYear()+"-"+Math.floor(1000+Math.random()*9000); let data=new Date().toLocaleDateString("pt-AO"); let hora=new Date().toLocaleTimeString("pt-AO"); let book={codigo,nome:form.nome,bi:form.bi,prov:form.prov,mun:form.mun,bairro:form.bairro,posto:form.posto,comp:form.compNome,data,hora}; sessionData.books.push(book); saveS(); step=4; renderAgendar(); setTimeout(()=>{document.getElementById("recibo-area").innerHTML=`<div class="recibo" style="text-align:center"><div style="width:70px;height:70px;margin:auto;background:#dcfce7;border-radius:50%;display:grid;place-items:center;font-size:32px">✅</div><h2>Confirmado! 🎉</h2><p>${form.prov} → ${form.mun} → ${form.bairro} → ${form.posto}</p><div style="text-align:left;font-size:12px;background:#f8fafc;padding:12px;border-radius:12px;margin-top:10px"><b>Código:</b> ${codigo}<br><b>Nome:</b> ${form.nome}<br><b>BI:</b> ${form.bi}<br><b>Local:</b> ${form.prov} / ${form.mun} / ${form.bairro}<br><b>Posto:</b> ${form.posto}<br><b>Comp:</b> ${form.compNome}</div><button class="btn btn-p" style="margin-top:10px" onclick="baixarPDF('${codigo}')">Baixar PDF</button></div>`;},300);}
function baixarPDF(cod){let b=sessionData.books.find(x=>x.codigo===cod); const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.text("SERVIÇO DE MIGRAÇÃO E ESTRANGEIROS - ANGOLA",10,10); doc.text("Codigo: "+b.codigo,10,20); doc.text("Nome: "+b.nome,10,27); doc.text("Provincia: "+b.prov,10,34); doc.text("Posto: "+b.posto,10,41); doc.save(cod+".pdf");}
document.getElementById("p-criar").innerHTML=`<div class="card"><h2>Criar Conta</h2><p style="font-size:11px">Inserir nome completo, email e senha para criar a sua conta no site ou portal SME Angola</p><label class="label">Nome</label><input id="c-n" class="input" autocomplete="off"><label class="label">Email</label><input id="c-e" class="input" autocomplete="off"><label class="label">Senha</label><input id="c-s" type="password" class="input" autocomplete="new-password"><br><button class="btn btn-p" style="margin-top:10px" onclick="criar()">Criar Conta</button><p id="c-msg"></p></div>`;
function criar(){let n=document.getElementById("c-n").value,e=document.getElementById("c-e").value,s=document.getElementById("c-s").value; if(!n||!e||!s) return; sessionData.accs.push({nome:n,email:e,senha:s}); saveS(); document.getElementById("c-msg").innerText="Conta Criada"; document.getElementById("c-n").value=""; document.getElementById("c-e").value=""; document.getElementById("c-s").value="";}
document.getElementById("p-login").innerHTML=`<div class="card"><h2>Login - Seguro</h2><label class="label">Email</label><input id="l-e" class="input" autocomplete="off"><label class="label">Senha</label><input id="l-s" type="password" class="input" autocomplete="off"><br><button class="btn btn-p" style="margin-top:10px" onclick="login()">Entrar</button><p id="l-msg"></p></div>`;
function login(){let e=document.getElementById("l-e").value,s=document.getElementById("l-s").value; let f=sessionData.accs.find(a=>a.email===e&&a.senha===s); if(!f) return document.getElementById("l-msg").innerText="Inválido"; document.getElementById("l-e").value=""; document.getElementById("l-s").value=""; sessionData.user=f; saveS(); go("perfil");}
function renderPerfil(){if(!sessionData.user){document.getElementById("p-perfil").innerHTML=`<div class="card"><p>Faça login</p><button class="btn btn-p" onclick="go('login')">Login</button></div>`; return;} document.getElementById("p-perfil").innerHTML=`<div class="card"><h2>Meu Perfil</h2><p>Nome: ${sessionData.user.nome}<br>Email: ${sessionData.user.email}</p><button class="btn" style="background:#e2e8f0;margin-top:10px" onclick="clearAll()">Apagar dados 🗑️</button></div>`;}
function renderPedidos(){let list=sessionData.books; document.getElementById("p-pedidos").innerHTML=`<div class="card"><h2>Meus Pedidos</h2>${list.length===0?"<p>Nenhum</p>":list.map(b=>`<div class="card" style="margin-top:8px"><b>${b.codigo}</b> - ${b.prov}/${b.mun}<br><button class="btn btn-p" style="padding:6px 12px;font-size:11px;margin-top:6px" onclick="baixarPDF('${b.codigo}')">Baixar PDF</button></div>`).join("")}</div>`;}
document.getElementById("p-consulta").innerHTML=`<div class="card"><h2>Consultar Recibo</h2><input id="cons-cod" class="input" autocomplete="off" placeholder="Código"><button class="btn btn-p" style="margin-top:10px" onclick="consultar()">Consultar</button><div id="cons-res" style="margin-top:12px"></div></div>`;
function consultar(){let c=document.getElementById("cons-cod").value.trim(); let f=sessionData.books.find(b=>b.codigo===c); document.getElementById("cons-res").innerHTML=f?`<div class="card"><b>${f.codigo}</b><br>${f.nome} - ${f.prov}/${f.mun}<br>${f.posto}</div>`:`<p>Não encontrado</p>`;}
renderNav(); renderInicio(); go("inicio");
</script>
</body>
</html>
